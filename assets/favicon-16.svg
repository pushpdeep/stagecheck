<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs><pattern id="h" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line class="hl" x1="0" y1="0" x2="0" y2="7" stroke-width="3"/></pattern></defs>
  <style>
    .ink{fill:#1A2332}
    .judged{fill:#2F6B4F}
    .failed{fill:#A4322B}
    .hl{stroke:#9A958C}
    .quiet{fill:#6E6A63}
    @media (prefers-color-scheme: dark){
      .ink{fill:#E6E9ED}
      .judged{fill:#5FBF88}
      .failed{fill:#E27A72}
      .hl{stroke:#7E8895}
      .quiet{fill:#9AA3AF}
    }
  </style>
  <rect class="ink" x="0" y="0" width="2.56" height="16" rx="0.46"/>
  <rect class="judged" x="4.16" y="2.56" width="12.48" height="2.56" rx="0.46"></rect>
  <rect class="failed" x="4.16" y="6.72" width="7.68" height="2.56" rx="0.46"></rect>
  <rect x="4.16" y="10.88" width="9.92" height="2.56" rx="0.46" fill="url(#h)"></rect>
</svg>